<h1>Liste des festivals</h1>
<h2>Nombre de festival : {{ service.festivalCount() }}</h2>

@for (festival of service.festivals(); track festival.id) {
    <app-festival-card-component
        [id]="festival.id">
    </app-festival-card-component>
}

<app-festival-form/>

<button (click)="AddFestival()">
    Ajouter un festival
</button>
